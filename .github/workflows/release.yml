name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t ameen/api:${{ github.ref_name }} .

      - name: Build admin console image
        run: docker build -f apps/admin-web/Dockerfile -t ameen/admin-web:${{ github.ref_name }} .
