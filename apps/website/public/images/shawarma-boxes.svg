<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="ped" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#115e59"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#115e59"/></linearGradient>
  </defs>
  <rect width="800" height="700" fill="url(#bg)"/>
  <circle cx="400" cy="320" r="250" fill="#fff" fill-opacity=".12"/>
  <!-- pedestal -->
  <path d="M130 600v50q0 45 270 45t270-45v-50Z" fill="#134e4a"/>
  <ellipse cx="400" cy="600" rx="270" ry="55" fill="url(#ped)"/>
  <ellipse cx="400" cy="592" rx="230" ry="42" fill="#ccfbf1" fill-opacity=".3"/>
  <!-- shawarma roll sticking out -->
  <g transform="rotate(-14 400 230)">
    <rect x="352" y="70" width="96" height="190" rx="46" fill="#d6a35a"/>
    <rect x="352" y="70" width="96" height="190" rx="46" fill="none" stroke="#a16207" stroke-width="4"/>
    <path d="M360 108q40 22 80 0" fill="none" stroke="#a16207" stroke-width="4"/>
    <circle cx="378" cy="82" r="10" fill="#4ade80"/><circle cx="402" cy="76" r="10" fill="#ef4444"/><circle cx="424" cy="84" r="10" fill="#4ade80"/>
    <rect x="340" y="150" width="120" height="110" rx="8" fill="#fffbeb"/>
    <path d="M340 150h120" stroke="#fde68a" stroke-width="5"/>
  </g>
  <!-- box -->
  <polygon points="270,250 400,315 400,590 270,525" fill="#f59e0b"/>
  <polygon points="400,315 530,250 530,525 400,590" fill="#ea580c"/>
  <polygon points="400,185 530,250 400,315 270,250" fill="#fff7ed"/>
  <polygon points="400,205 495,252 400,300 305,252" fill="#7c2d12"/>
  <!-- left face -->
  <g transform="matrix(1 .5 0 1 270 250)">
    <text x="65" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#7c2d12" letter-spacing=".3">SHAWARMA</text>
    <text x="65" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c2d12" letter-spacing="4">ROLL BOX</text>
    <g transform="translate(40 120)">
      <rect x="0" y="0" width="50" height="95" rx="24" fill="#d6a35a" stroke="#7c2d12" stroke-width="3"/>
      <circle cx="16" cy="14" r="6" fill="#4ade80"/><circle cx="30" cy="11" r="6" fill="#ef4444"/><circle cx="40" cy="18" r="6" fill="#4ade80"/>
      <rect x="-4" y="50" width="58" height="45" rx="5" fill="#fffbeb" stroke="#7c2d12" stroke-width="3"/>
    </g>
  </g>
  <!-- right face -->
  <g transform="matrix(1 -.5 0 1 400 315)">
    <text x="65" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff7ed"><tspan fill="#fde68a">D</tspan>.PACKO</text>
    <text x="65" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#fed7aa" letter-spacing="2.4">PACKAGING SOLUTIONS</text>
  </g>
</svg>
